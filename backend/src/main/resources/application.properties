spring.application.name=security-demosu
#security
spring.security.user.password=${SPRING_SECURITY_PASSWORD:local-dev-only}
spring.security.user.name=user
security.jwt.secret-key =${JWT_SECRET:local-dev-change-me}

#database connection
spring.datasource.url=jdbc:mysql://localhost:3306/securityproject?createDatabaseIfNotExist=true&useUnicode=true&useLegacyDatetimeCode
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


#image service
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
cloudinary.cloudname =${CLOUDINARY_CLOUD_NAME:}
cloudinary.apikey =${CLOUDINARY_API_KEY:}
cloudinary.apisecret =${CLOUDINARY_API_SECRET:}

#loglamakla alakali basit bir ayar
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
